use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG"

search:
  formats:
    - html
    - json
    - rss

server:
  limiter: false
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "WHLAKqHEUEJZhe7GXwIXfLUVNBKoJC0D-tsZk7Kt4csXYCq-0kQGpKAx0hB62w28"

botdetection:
  enabled: false

# Disable ALL default engines first, then explicitly enable only duckduckgo_html.
# This avoids the upstream wikidata engine bug (KeyError on processor lookup) that
# crashes every search in recent searxng/searxng:latest images.
engines:
  # First disable everything known to cause issues
  - name: wikidata
    enabled: false
  - name: wikipedia
    enabled: false
  - name: google
    enabled: false
  - name: bing
    enabled: false
  - name: brave
    enabled: false
  - name: duckduckgo
    enabled: false
  - name: startpage
    enabled: false
  # Now explicitly enable only the one that works
  - name: duckduckgo_html
    enabled: true
